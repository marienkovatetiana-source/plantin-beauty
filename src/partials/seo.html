  <title>{{seo.title}}</title>
  <meta name="description" content="{{seo.description}}">
  {{#if seo.keywords}}<meta name="keywords" content="{{seo.keywords}}">{{/if}}
  {{#if seo.noindex}}<meta name="robots" content="noindex">{{else}}<link rel="canonical" href="{{url}}">{{/if}}
  <meta name="theme-color" content="#2f3a5c">
  <meta property="og:site_name" content="Plantin Beauty Studio">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="en_BE">
  <meta property="og:title" content="{{seo.title}}">
  <meta property="og:description" content="{{seo.description}}">
  <meta property="og:url" content="{{url}}">
  <meta property="og:image" content="{{siteUrl}}/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{seo.title}}">
  <meta name="twitter:description" content="{{seo.description}}">
  <meta name="twitter:image" content="{{siteUrl}}/og-image.jpg">
  {{#if schema}}<script type="application/ld+json">{{{schema}}}</script>{{/if}}
