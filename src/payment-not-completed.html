<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  {{> seo}}

  <script type="module" src="/js/main.js"></script>
</head>
<body>
  {{> header}}

  <main id="main">
    <section class="plate-hero plate-hero--solo" aria-labelledby="pay-title">
      <div class="plate-hero__plate">
        <p class="plate-hero__eyebrow label-s">Payment not completed</p>
        <h1 class="plate-hero__title" id="pay-title">Nothing was charged</h1>
        <p class="plate-hero__lead">The payment was cancelled or didn’t go through. Your details are saved — try again or choose another method.</p>
        <div class="plate-hero__cta">
          <a class="btn btn--primary" href="checkout.html">Try again <svg class="icon" width="20" height="20" aria-hidden="true" focusable="false"><use href="#arrow"/></svg></a>
          <a class="btn btn--secondary" href="checkout.html#payment">Choose another method</a>
        </div>
        <a class="link-arrow plate-hero__link" href="https://wa.me/32468264014" target="_blank" rel="noopener"><span class="link-arrow__text">Questions? WhatsApp us</span><svg class="icon icon--arrow-s" width="16" height="16" aria-hidden="true" focusable="false"><use href="#arrow-small"/></svg></a>
      </div>
    </section>
  </main>

  {{> footer}}
</body>
</html>
